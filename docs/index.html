 member, standing editorial board member and associate editor of several journals. He is a consultant/research fellow at Harvard Medical School / Massachusetts General Hospital, a recipient of the Sichuan Provincial High-level Overseas Talent Program, and one of only five scholars selected for all three of the first National Symposiums for Young Biomechanics Scholars (40 scholars each)."},location:{zh:"四川大学（望江校区）建筑与环境学院 · 生物力学工程省重点实验室",en:"Key Laboratory of Biomechanical Engineering of Sichuan Province, Wangjiang Campus, Sichuan University"},email:"bmeliuzhan@163.com",phone:"028-85405140 (兼传真)",links:[{label:{zh:"刘展教授主页",en:"Prof. Zhan Liu"},url:"https://acem.scu.edu.cn/info/1028/13087.htm"},{label:{zh:"川大建筑与环境学院",en:"College of Architecture & Environment"},url:"https://acem.scu.edu.cn/"}],researchAreas:[{id:"biomech",icon:"heart",title:{zh:"生物医学工程",en:"Biomedical Engineering"},summary:{zh:"围绕口腔颌面与肌骨系统的结构—功能关系开展生物力学研究，构建个体化三维有限元模型并结合实验验证，服务于疾病的机制阐释与临床方案评估。",en:"We investigate structure-function relationships of the craniofacial and musculoskeletal systems through biomechanics, building subject-specific 3D finite element models validated by experiments to illuminate disease mechanisms and evaluate clinical protocols."},keywords:[{zh:"生物力学",en:"Biomechanics"},{zh:"有限元分析",en:"Finite Element Analysis"},{zh:"肌骨系统",en:"Musculoskeletal System"}]},{id:"tmj",icon:"eye",title:{zh:"颞下颌关节与口腔健康工程",en:"TMJ & Oral Health Engineering"},summary:{zh:"聚焦颞下颌关节紊乱病（TMD）的运动学表征与力学调控，建立动态关节间隙、螺旋轴等关键指标的测量方法，并发展髁突运动导板等动态调控手段。同时开展正颌外科、隐形矫治与口腔修复相关的生物力学评价。",en:"Our work centers on kinematic characterization and mechanical modulation of temporomandibular disorders (TMD). We establish metrics such as dynamic joint space and finite helical axis, develop dynamic control devices such as condylar motion guides, and provide biomechanical evaluation for orthognathic surgery, clear aligner treatment and restorative dentistry."},keywords:[{zh:"颞下颌关节",en:"Temporomandibular Joint"},{zh:"牙颌面畸形",en:"Maxillofacial Deformity"},{zh:"运动学测量",en:"Kinematic Measurement"}]},{id:"device",icon:"chip",title:{zh:"医疗平台及器械开发",en:"Medical Platforms & Device Development"},summary:{zh:"开展医疗平台与器械的优化设计和性能验证，包括髋关节/膝关节假体界面受力分析、髓内钉固定评价、3D 打印矫形器力学检测、植体 anchorage 评估等工程转化工作。",en:"We conduct design optimization and performance validation of medical platforms and devices, including hip/knee prosthesis interface mechanics, intramedullary nail fixation, mechanical testing of 3D-printed orthoses, and anchorage evaluation."},keywords:[{zh:"医疗器械",en:"Medical Devices"},{zh:"关节假体",en:"Joint Prosthesis"},{zh:"3D 打印矫形器",en:"3D-Printed Orthoses"}]},{id:"material",icon:"sparkles",title:{zh:"仿生与功能材料",en:"Biomimetic & Functional Materials"},summary:{zh:"受鱼鳞、龙虾、褐鹈鹕等生物结构启发，研发透明柔软、抗裂损的高性能弹性体与水凝胶，并结合框架核酸等新材料开展主动靶向治疗研究。",en:"Inspired by structures such as fish scales, lobster and the brown pelican, we develop transparent, soft and crack-resistant high-performance elastomers, and explore framework nucleic acid based nanodevices for active targeting therapy."},keywords:[{zh:"仿生材料",en:"Biomimetic Materials"},{zh:"抗裂弹性体",en:"Crack-resistant Elastomers"},{zh:"框架核酸",en:"Framework Nucleic Acid"}]}],news:[]},mg={class:"sticky top-0 z-40 border-b border-ink-100/80 bg-white/85 backdrop-blur-md"},gg={class:"wrap flex h-16 items-center justify-between gap-4"},pg={class:"grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 text-sm font-bold text-white shadow-sm"},yg={class:"min-w-0"},_g={class:"block truncate text-[15px] font-semibold leading-tight text-ink-900"},bg={class:"block truncate text-[11px] leading-tight text-ink-400"},vg={class:"hidden items-center gap-1 lg:flex"},Eg={class:"flex items-center gap-2"},xg=["aria-label"],Sg=["aria-expanded"],Cg={class:"h-5 w-5",viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":"2"},Tg={key:0,d:"M4 7h16M4 12h16M4 17h16","stroke-linecap":"round"},Lg={key:1,d:"M6 6l12 12M18 6L6 18","stroke-linecap":"round"},kg={key:0,class:"border-t b  余项（含国家自然科学基金项目），以第一/通讯作者发表 SCI 论文 100 余篇，获 2009 年四川省医学科技二等奖。

兼任 Associate Editor, Medicine in Novel Technology and Devices；Guest Editor, Frontiers in Bioengineering and Biotechnology 与 Applied Sciences；《医用生物力学》《中国修复重建外科杂志》编委、《中华医学研究杂志》常务编委；World Association for Chinese Biomedical Engineers 终身会员及委员、中国生物材料学会材料生物力学分会委员、中国生物医学工程学会终身会员；担任 Journal of Biomechanics、Journal of Dental Research、Medical Engineering & Physics 等十余本期刊审稿人。哈佛医学院/麻省总医院顾问/研究员；四川省海外高层次留学人才；四川省学术和技术带头人后备人选。连续入选前三届全国生物力学青年学者学术研讨会（每届全国 40 人，三届同时入选者仅 5 人）。

开设课程：《力学通用软件及应用》《数值建模与仿真》《图像处理及绘制》《数值仿真工程案例赏析》。`,en:`Professor and Ph.D. supervisor in the College of Architecture and Environment, Sichuan University, and a core member of the Key Laboratory of Biomechanical Engineering of Sichuan Province. He received his B.Eng., M.Eng. and Ph.D. from Sichuan University in 2000, 2003 and 2006, joined the faculty in 2003 (assistant lecturer, lecturer, associate professor and then professor), and was a visiting scholar at Harvard University from March 2014 to March 2016. His research covers oral and musculoskeletal health engineering, biomimetic and functional materials, and medical platform/device development. He has led more than 20 research projects including NSFC grants, published over 100 SCI papers as first/corresponding author, and received the Second Prize of Sichuan Medical Science and Technology Award (2009).

He serves as Associate Editor of Medicine in Novel Technology and Devices, Guest Editor of Frontiers in Bioengineering and Biotechnology and Applied Sciences, editorial board member of Journal of Medical Biomechanics and Chinese Journal of Reparative and Reconstructive Surgery, standing editorial board member of Chinese Journal of Medical Research, life member and committee member of the World Association for Chinese Biomedical Engineers, committee member of the Biomechanics Branch of the Chinese Society for Biomaterials, and life member of the Chinese Society of Biomedical Engineering. He reviews for more than ten journals including Journal of Biomechanics, Journal of Dental Research and Medical Engineering & Physics. He is a consultant/research fellow at Harvard Medical School / Massachusetts General Hospital, a recipient of the Sichuan Provincial High-level Overseas Talent Program, a candidate for Sichuan Provincial Academic and Technical Leader, and one of only five scholars selected for all three of the first National Symposiums for Young Biomechanics Scholars (40 scholars each).

Courses: General Mechanical Software and Applications, Numerical Modeling and Simulation, Image Processing and Rendering, and Case Studies of Numerical Simulation in Engineering.`}}],iy={class:"wrap py-16"},oy={class:"mb-12 text-center text-sm text-ink-400"},ry={class:"mb-5 flex items-center gap-3"},sy={class:"text-xl font-bold text-ink-900"},ay={class:"badge bg-brand-50 text-brand-700 ring-1 ring-inset ring-brand-100"},ly={class:"card mt-4 bg-gradient-to-br from-brand-600 to-brand-800 p-8 text-white"},cy={class:"text-2xl font-bold"},uy={class:"mt-3 max-w-3xl text-sm leading-relaxed text-white/85"},fy={class:"mt-6 flex flex-wrap gap-3"},hy={__name:"MembersView",setup(e){const{t}=Xe();Ut();const n=[{key:"pi",role:"pi",titleKey:"rolePi"},{key:"faculty",role:"faculty",titleKey:"roleFaculty"},{key:"phd",role:"phd",titleKey:"rolePhd"},{key:"master",role:"master",titleKey:"roleMaster"},{key:"alumni",role:"alumni",titleKey:"roleAlumni"}],i=oe(()=>n.map(r=>({...r,title:t(`members.${r.titleKey}`),list:gu.filter(s=>s.role===r.role)})).filter(r=>r.list.length>0)),o=oe(()=>gu.length);return(r,s)=>{const a=mi("router-link");return $(),U("div",iy,[he(on,{label:E(t)("members.label"),title:E(t)("members.title"),desc:E(t)("members.desc"),center:""},null,8,["label","title","desc"]),y("p",oy,w(E(t)("common.total",{n:o.value})),1),($(!0),U(le,null,xe(i.value,l=>($(),U("section",{key:l.key,class:"mb-14"},[y("div",ry,[y("h2",sy,w(l.title),1),y("span",ay,w(l.list.length),1),s[1]||(s[1]=y("span",{class:"h-px flex-1 bg-ink-100"},null,-1))]),y("div",{class:De(["grid gap-5",l.key==="pi"?"md:grid-cols-1":"md:grid-cols-2 xl:grid-cols-3"])},[($(!0),U(le,null,xe(l.list,c=>($(),Ct(ny,{key:c.id,person:c},null,8,["person"]))),128))],2)]))),128)),y("section",ly,[y("h3",cy,w(E(t)("contact.admission")),1),y("p",uy,w(E(t)("contact.admissionText")),1),y("div",fy,[y("a",{href:"#",class:"btn bg-white text-brand-700 hover:bg-brand-50",onClick:s[0]||(s[0]=Pn(l=>E(zn)(E(ce).email),["prevent"]))},w(E(Ii)(E(ce)
