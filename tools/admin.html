<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内容管理后台 · 健康工程实验室</title>
<style>
  :root{ --brand:#1b56f1; --brand-soft:#eef6ff; --ink-900:#111827; --ink-600:#4b5563; --ink-400:#98a2b3; --line:#eceef2; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-900);background:#f6f7f9}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:16px;font-weight:700}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:13px}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .spacer{flex:1}
  button{border-radius:10px;border:1px solid var(--line);background:#fff;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:#8ec2ff}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.danger{color:#b42318;border-color:#fecaca;background:#fef3f2}
  .wrap{display:grid;grid-template-columns:280px 1fr;gap:0;height:calc(100vh - 61px)}
  aside{border-right:1px solid var(--line);background:#fff;overflow:auto}
  .search{padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
  .search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .item{padding:10px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:13px}
  .item:hover{background:var(--brand-soft)}
  .item.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
  .item small{display:block;color:var(--ink-400);font-size:11px}
  main{overflow:auto;padding:20px 24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:15px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-600);margin-bottom:4px}
  input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:13px/1.5 inherit;background:#fff;color:inherit}
  textarea{resize:vertical}
  textarea.mono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}
  .field{margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .muted{color:var(--ink-400);font-size:12px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--brand-soft);color:#1641e1;font-size:11px}
  .toast{position:fixed;right:18px;bottom:18px;padding:10px 16px;border-radius:10px;background:#111827;color:#fff;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>内容管理后台</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <button id="btnAdd">+ 新增条目</button>
  <button id="btnJson">JSON 源码</button>
  <button id="btnBuild">重新构建网站</button>
  <button id="btnGit">git 状态</button>
  <button id="btnSave" class="primary" disabled>保存更改</button>
</header>

<div class="wrap">
  <aside>
    <div class="search"><input id="q" type="text" placeholder="搜索条目…" /></div>
    <div id="list"></div>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
const TITLES = {
  site: () => '站点信息',
  members: (x) => txt(x.name) || '(未命名)',
  publications: (x) => (txt(x.title) || '').slice(0, 90) || '(未命名)',
  projects: (x) => txt(x.name) || '(未命名)',
  activities: (x) => `${x.date || ''} · ${txt(x.title) || '(未命名)'}`
}
const SUBS = {
  site: () => '实验室名称、简介、联系方式、研究方向',
  members: (x) => `${x.role || ''} ${txt(x.title) || ''}`.trim(),
  publications: (x) => `${x.year || ''} ${txt(x.venue) || x.venueShort || ''}`.trim(),
  projects: (x) => `${x.category || ''} ${txt(x.role) || ''}`.trim(),
  activities: (x) => x.category || ''
}
const TEMPLATES = {
  members: () => ({ id: 'm-' + uid(), name: { zh: '新成员', en: 'New Member' }, role: 'master', title: { zh: '', en: '' }, email: '', year: String(new Date().getFullYear()), interests: [], bio: { zh: '', en: '' } }),
  publications: () => ({ id: 'p-' + uid(), title: { zh: '新论文标题', en: 'New paper title' }, authors: '', venue: { zh: '', en: '' }, venueShort: '', year: new Date().getFullYear(), type: 'journal', highlight: false, doi: '', links: [] }),
  projects: () => ({ id: 'pr-' + uid(), name: { zh: '新项目', en: 'New project' }, category: 'horizontal', pi: '', role: { zh: '主持', en: 'PI' }, period: '', amount: '', desc: { zh: '', en: '' } }),
  activities: () => ({ id: 'a-' + uid(), date: new Date().toISOString().slice(0, 10), title: { zh: '新活动', en: 'New activity' }, category: 'life', location: { zh: '', en: '' }, text: { zh: '', en: '' }, images: [] })
}
const ROLES_HINT = { members: 'role 可选：teacher（老师）/ phd（博士研究生）/ master（硕士研究生）/ alumni（毕业生）' }

let state = { ds: 'site', kind: 'object', data: null, index: -1, dirty: false, query: '' }

function uid(){ return Math.random().toString(36).slice(2, 8) }
function txt(v){ if(!v) return ''; if(typeof v === 'string') return v; return v.zh || v.en || '' }
function isBi(v){ return v && typeof v === 'object' && !Array.isArray(v) && ('zh' in v || 'en' in v) }
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show')
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200)
}
function markDirty(state_){ state.dirty = true; document.getElementById('btnSave').disabled = false }

async function api(url, opts){
  const r = await fetch(url, opts)
  return r.json()
}

async function loadTabs(){
  const res = await api('/api/datasets')
  const tabs = document.getElementById('tabs')
  tabs.innerHTML = ''
  res.datasets.forEach(d => {
    const b = document.createElement('button')
    b.className = 'tab' + (d.key === state.ds ? ' on' : '')
    b.textContent = `${d.label}${d.kind === 'array' ? ` (${d.count})` : ''}`
    b.onclick = async () => {
      if (state.dirty && !confirm('有未保存的更改，确定切换吗？')) return
      state.ds = d.key; state.kind = d.kind; state.index = d.kind === 'object' ? -1 : 0
      await loadData(); loadTabs()
    }
    tabs.appendChild(b)
  })
}

async function loadData(){
  const res = await api('/api/data?name=' + state.ds)
  state.data = res.data; state.kind = res.kind
  state.dirty = false; document.getElementById('btnSave').disabled = true
  if (state.kind === 'object') state.index = -1
  if (state.kind === 'array' && (state.index < 0 || state.index >= state.data.length)) state.index = state.data.length ? 0 : -1
  render()
}

function render(){
  renderList(); renderForm()
  document.getElementById('btnAdd').style.display = state.kind === 'array' ? '' : 'none'
}

function renderList(){
  const box = document.getElementById('list')
  box.innerHTML = ''
  if (state.kind === 'object'){
    const d = document.createElement('div'); d.className = 'item on'
    d.innerHTML = '<strong>站点信息</strong><small>site.json</small>'
    box.appendChild(d); return
  }
  const q = state.query.trim().toLowerCase()
  state.data.forEach((item, i) => {
    const title = TITLES[state.ds](item)
    const sub = SUBS[state.ds](item)
    if (q && !(title + ' ' + sub).toLowerCase().includes(q)) return
    const d = document.createElement('div')
    d.className = 'item' + (i === state.index ? ' on' : '')
    d.innerHTML = `<div>${escapeHtml(title)}</div><small>${escapeHtml(sub)}</small>`
    d.onclick = async () => {
      if (state.dirty && !confirm('有未保存的更改，确定切换吗？')) return
      state.index = i; render()
    }
    box.appendChild(d)
  })
}

function escapeHtml(s){ return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function current(){
  return state.kind === 'object' ? state.data : state.data[state.index]
}

function renderForm(){
  const main = document.getElementById('main')
  main.innerHTML = ''
  const rec = current()
  if (!rec){ main.innerHTML = '<div class="card"><p class="muted">暂无条目，点击右上角「+ 新增条目」创建。</p></div>'; return }

  const card = document.createElement('div'); card.className = 'card'
  const bar = document.createElement('div'); bar.className = 'bar'
  const h = document.createElement('h2'); h.textContent = TITLES[state.ds](rec)
  bar.appendChild(h)
  const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = state.kind === 'object' ? '单文件数据' : `第 ${state.index + 1} / ${state.data.length} 条`
  bar.appendChild(pill)
  if (state.kind === 'array'){
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = '删除本条'
    del.onclick = () => {
      if (!confirm('确定删除该条目？可在保存前刷新页面撤销。')) return
      state.data.splice(state.index, 1)
      state.index = Math.max(0, Math.min(state.index, state.data.length - 1))
      markDirty(); render()
    }
    bar.appendChild(del)
  }
  card.appendChild(bar)

  if (ROLES_HINT[state.ds]){
    const w = document.createElement('div'); w.className = 'warn'; w.textContent = ROLES_HINT[state.ds]
    card.appendChild(w)
  }

  const form = document.createElement('div')
  Object.keys(rec).forEach(key => form.appendChild(fieldBox(key, rec[key], v => { rec[key] = v; markDirty() })))
  card.appendChild(form)

  const raw = document.createElement('div'); raw.className = 'field'
  raw.innerHTML = '<label>本条 JSON（高级：可整体粘贴修改）</label>'
  const ta = document.createElement('textarea'); ta.className = 'mono'; ta.rows = 8
  ta.value = JSON.stringify(rec, null, 2)
  const apply = document.createElement('button'); apply.style.marginTop = '6px'; apply.textContent = '应用本条 JSON'
  apply.onclick = () => {
    try {
      const parsed = JSON.parse(ta.value)
      Object.keys(rec).forEach(k => delete rec[k])
      Object.assign(rec, parsed)
      markDirty(); render(); toast('已应用')
    } catch (e) { toast('JSON 解析失败：' + e.message) }
  }
  raw.appendChild(ta); raw.appendChild(apply)
  card.appendChild(raw)
  main.appendChild(card)
}

function fieldBox(key, value, onChange){
  const box = document.createElement('div'); box.className = 'field'
  box.innerHTML = `<label>${escapeHtml(key)}${isBi(value) ? ' · 中英双语' : ''}</label>`
  if (isBi(value)){
    const g = document.createElement('div'); g.className = 'grid'
    g.appendChild(input('中文 (zh)', value.zh || '', v => { value.zh = v }))
    g.appendChild(input('English (en)', value.en || '', v => { value.en = v }))
    box.appendChild(g); return box
  }
  if (Array.isArray(value)){
    if (value.length && value.every(isBi)){
      const wrap = document.createElement('div')
      value.forEach((v, i) => {
        const row = document.createElement('div'); row.className = 'row'
        const a = document.createElement('input'); a.type = 'text'; a.value = v.zh || ''; a.placeholder = '中文'
        a.style.flex = '1'; a.oninput = () => { v.zh = a.value; markDirty() }
        const b = document.createElement('input'); b.type = 'text'; b.value = v.en || ''; b.placeholder = 'English'
        b.style.flex = '1'; b.oninput = () => { v.en = b.value; markDirty() }
        const rm = document.createElement('button'); rm.textContent = '×'; rm.onclick = () => { value.splice(i, 1); markDirty(); render() }
        row.appendChild(a); row.appendChild(b); row.appendChild(rm); wrap.appendChild(row)
      })
      const add = document.createElement('button'); add.textContent = '+ 添加一条'; add.style.marginTop = '6px'
      add.onclick = () => { value.push({ zh: '', en: '' }); markDirty(); render() }
      box.appendChild(wrap); box.appendChild(add); return box
    }
    if (value.every(v => typeof v === 'string')){
      const ta = document.createElement('textarea'); ta.rows = Math.max(2, value.length + 1)
      ta.value = value.join('\n'); ta.placeholder = '每行一条'
      ta.oninput = () => { onChange(ta.value.split('\n')) }
      box.appendChild(ta); return box
    }
    return rawField(box, value, onChange)
  }
  if (typeof value === 'boolean'){
    const row = document.createElement('div'); row.className = 'row'
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = value
    cb.onchange = () => { onChange(cb.checked); markDirty() }
    const span = document.createElement('span'); span.className = 'muted'; span.textContent = value ? 'true' : 'false'
    cb.onchange = () => { span.textContent = cb.checked ? 'true' : 'false'; onChange(cb.checked); markDirty() }
    row.appendChild(cb); row.appendChild(span); box.appendChild(row); return box
  }
  if (typeof value === 'number'){
    const i = document.createElement('input'); i.type = 'number'; i.value = value
    i.oninput = () => { onChange(Number(i.value)); markDirty() }
    box.appendChild(i); return box
  }
  if (typeof value === 'object' && value !== null) return rawField(box, value, onChange)
  const isLong = typeof value === 'string' && (value.length > 90 || value.includes('\n'))
  if (isLong){
    const ta = document.createElement('textarea'); ta.rows = Math.min(12, Math.ceil(value.length / 60) + 2)
    ta.value = value; ta.oninput = () => { onChange(ta.value); markDirty() }
    box.appendChild(ta); return box
  }
  const i = document.createElement('input'); i.type = 'text'; i.value = value == null ? '' : value
  i.oninput = () => { onChange(i.value); markDirty() }
  box.appendChild(i); return box
}

function input(labelText, value, onInput){
  const d = document.createElement('div')
  const l = document.createElement('label'); l.textContent = labelText
  const i = document.createElement('input'); i.type = 'text'; i.value = value
  i.oninput = () => { onInput(i.value); markDirty() }
  d.appendChild(l); d.appendChild(i); return d
}

function rawField(box, value, onChange){
  const ta = document.createElement('textarea'); ta.className = 'mono'; ta.rows = 6
  ta.value = JSON.stringify(value, null, 2)
  ta.oninput = () => {
    try { onChange(JSON.parse(ta.value)); markDirty() }
    catch (e) { /* 输入过程中允许临时非法 JSON */ }
  }
  const hint = document.createElement('div'); hint.className = 'muted'; hint.textContent = 'JSON 格式，修改后立即生效（需为合法 JSON）'
  box.appendChild(ta); box.appendChild(hint); return box
}

document.getElementById('q').oninput = (e) => { state.query = e.target.value; renderList() }

document.getElementById('btnAdd').onclick = () => {
  const tpl = TEMPLATES[state.ds]()
  state.data.unshift(tpl); state.index = 0; markDirty(); render(); toast('已新增，请填写内容后保存')
}

document.getElementById('btnSave').onclick = async () => {
  const res = await api('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: state.ds, data: state.data })
  })
  if (res.ok){ state.dirty = false; document.getElementById('btnSave').disabled = true; toast('已保存到 src/data/' + state.ds + '.json（已自动备份）') }
  else toast('保存失败：' + res.error)
}

document.getElementById('btnJson').onclick = () => {
  const w = window.open('', '_blank')
  w.document.write('<pre style="font:12px/1.5 monospace;padding:16px">' + escapeHtml(JSON.stringify(state.data, null, 2)) + '</pre>')
}

document.getElementById('btnBuild').onclick = async () => {
  toast('正在构建，请稍候…')
  const res = await api('/api/build', { method: 'POST' })
  toast(res.ok ? '构建完成：dist/index.html 已更新' : '构建失败，请查看终端输出')
  if (!res.ok) console.log(res.output)
}

document.getElementById('btnGit').onclick = async () => {
  const res = await api('/api/status')
  const w = window.open('', '_blank')
  w.document.write('<pre style="font:12px/1.5 monospace;padding:16px">' + escapeHtml(res.output || '(无输出)') + '</pre>')
}

window.addEventListener('beforeunload', (e) => { if (state.dirty){ e.preventDefault(); e.returnValue = '' } })

;(async () => { await loadTabs(); await loadData() })()
</script>
</body>
</html>
